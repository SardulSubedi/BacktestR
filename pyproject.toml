[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtestr"
version = "0.1.0"
description = "English strategy clarification, causal daily-bar research, and C++20 export"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
backtestr = "backtestr.__main__:main"

[tool.setuptools.packages.find]
include = ["backtestr*"]

[tool.setuptools.package-data]
backtestr = ["web/*", "templates/*", "templates/**/*"]
